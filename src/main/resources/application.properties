spring.application.name=client

server.port=8081

# DynamoDB Local (repositorio infraestructure)
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.region=eu-west-1
aws.dynamodb.table-name=MainTable
aws.dynamodb.access-key=local
aws.dynamodb.secret-key=local

# Llamadas a merchant-microservice (Feign)
merchant.service.url=http://localhost:8082
spring.cloud.openfeign.client.config.merchant-service.connect-timeout=2000
spring.cloud.openfeign.client.config.merchant-service.read-timeout=3000